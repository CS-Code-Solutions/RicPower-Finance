<!-- ABA INTEGRAÇÕES / EXCEL -->
<section id="tab-extensao" class="tab-content">
    <div class="dashboard-grid">
        <!-- PAINEL DE IMPORTAÇÃO EXCEL -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title"><i class="fas fa-file-excel text-success"></i> Importação de Planilha Excel (.xlsx)</div>
            </div>
            <div class="form-group mb-15" style="margin-bottom: 15px;">
                <label class="form-label" style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px;">LIMITE DE IMPORTAÇÃO</label>
                <select id="excelImportLimit" class="form-control" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
                    <option value="ALL">Toda a planilha (Todos os registros)</option>
                    <option value="50">Últimos 50 registros</option>
                    <option value="100">Últimos 100 registros</option>
                    <option value="200">Últimos 200 registros</option>
                </select>
            </div>
            <div class="form-group mb-15" style="margin-bottom: 15px;">
                <label class="form-label" style="display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px;">SELECIONE O ARQUIVO EXCEL</label>
                <input type="file" id="fileExcelInput" class="form-control" accept=".xlsx, .xls" onchange="importarPlanilhaExcel(event)" style="width: 100%; padding: 8px;">
            </div>
            <p class="subtitle" style="font-size: 12px; color: #777;">
                <i class="fas fa-info-circle"></i> O leitor automático processa abas nomeadas como "PAGAR/SAIDA" e "RECEBER/ENTRADA".
            </p>
        </div>

        <!-- PAINEL DE BACKUP & EXPORTAÇÕES -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title"><i class="fas fa-database"></i> Backup & Exportação Manual</div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <button class="btn btn-secondary" onclick="exportarBackupJSON()" style="padding: 10px; width: 100%; font-weight: bold;">
                    <i class="fas fa-download"></i> Baixar Backup do Sistema (JSON)
                </button>
                <label class="btn btn-warning" style="text-align: center; cursor: pointer; padding: 10px; width: 100%; font-weight: bold; display: block; box-sizing: border-box;">
                    <i class="fas fa-upload"></i> Restaurar Backup JSON
                    <input type="file" accept=".json" style="display: none;" onchange="importarBackupJSON(event)">
                </label>
                <button class="btn btn-success" onclick="exportarCSV('pagar')" style="padding: 10px; width: 100%; font-weight: bold;">
                    <i class="fas fa-file-csv"></i> Exportar Contas a Pagar (CSV)
                </button>
                <button class="btn btn-success" onclick="exportarCSV('receber')" style="padding: 10px; width: 100%; font-weight: bold;">
                    <i class="fas fa-file-csv"></i> Exportar Contas a Receber (CSV)
                </button>
            </div>
        </div>
    </div>
</section>
